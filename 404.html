<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Smart Tax Solution</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .not-found{min-height:70vh;display:grid;place-items:center;text-align:center;padding:2rem}
    .not-found-card{max-width:640px;padding:clamp(2rem,5vw,4rem);border-radius:22px;background:#fff;box-shadow:0 15px 45px rgba(16,35,66,.12)}
    .not-found h1{font-size:clamp(2.2rem,6vw,4rem);margin:.2rem 0;color:#142b4a}
    .not-found p{line-height:1.7;color:#4e5d70}
    .not-found-actions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem}
  </style>
</head>
<body>
  <main class="not-found">
    <section class="not-found-card">
      <p><strong>SMART TAX SOLUTION</strong></p>
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page may have moved or the address may be incorrect. You can return to our homepage or contact us for help with GST and Income Tax services.</p>
      <div class="not-found-actions">
        <a class="btn btn-primary" href="index.html">Go to Homepage</a>
        <a class="btn btn-secondary" href="contact.html">Contact Us</a>
      </div>
    </section>
  </main>
</body>
</html>
