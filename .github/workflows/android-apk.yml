name: Build Smart Tax Solution Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Tax-Solution-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Smart Tax Solution Android App
          body: Install the latest Smart Tax Solution Android app. For Android phones only.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
