<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Vacancies | Smart Tax Solution</title><link rel="stylesheet" href="style.css"><style>.jobs{max-width:1100px;margin:35px auto;padding:0 20px}.hero-j{background:linear-gradient(130deg,#142b4a,#1b5d91);color:white;padding:32px;border-radius:16px}.grid-j{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin:22px 0}.job,.apply{background:white;border:1px solid #dce4ef;border-radius:14px;padding:22px}.meta{color:#617287;font-size:13px}.jobs label{display:block;font-weight:700;margin:10px 0 5px}.jobs input,.jobs select,.jobs textarea{width:100%;padding:11px;border:1px solid #cbd6e2;border-radius:8px}.jobs textarea{min-height:90px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.jobs button{background:#1769aa;color:white;border:0;padding:12px 17px;border-radius:8px;font-weight:700;cursor:pointer}.msg{background:#f1f6fb;padding:12px;border-radius:8px;margin-top:10px}@media(max-width:650px){.formgrid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><img class="brand-logo" src="assets/smart-tax-solution-logo.svg" alt="Smart Tax Solution"></a><nav><a href="index.html">Home</a><a href="student.html">Student Portal</a><a href="admin.html">Admin</a></nav></header><main class="jobs"><section class="hero-j"><span class="meta" style="color:#d8e8f8">CAREERS • SMART TAX SOLUTION</span><h1>Find the right opportunity</h1><p>Choose your city, explore available openings, then apply online.</p></section><section class="apply" style="margin-top:22px"><h2>Explore vacancies by city</h2><label for="citySelect">Select City</label><select id="citySelect"><option value="">Choose a city</option></select><div id="jobsStatus" class="msg">Loading vacancies…</div><section id="jobsGrid" class="grid-j"></section></section><section class="apply" id="applyBox" hidden><h2>Application Information</h2><p class="meta" id="selectedJobSummary"></p><form id="applyForm"><input id="applyJob" type="hidden"><div class="formgrid"><div><label for="appName">Full name *</label><input id="appName" maxlength="120" required></div><div><label for="appEmail">Email *</label><input id="appEmail" type="email" maxlength="254" required></div><div><label for="appPhone">Mobile *</label><input id="appPhone" type="tel" maxlength="20" required></div><div><label for="appQualification">Qualification *</label><input id="appQualification" maxlength="180" required></div><div><label for="appResume">Resume link (optional)</label><input id="appResume" type="url" maxlength="500"></div></div><label for="appMessage">Experience / Message</label><textarea id="appMessage" maxlength="2000"></textarea><label><input id="appConsent" type="checkbox" required style="width:auto"> I agree to be contacted about this application.</label><button>Submit Application</button><div id="applyStatus" class="msg" role="status"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient("https://jbjergbqjokxxcvntimk.supabase.co","sb_publishable_wOwWiLuundz06ABsksvrbQ_2oXiV_5k"),$=id=>document.getElementById(id);let jobsList=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const {data,error}=await sb.from('job_vacancies').select('id,title,department,city,location,employment_type,salary,eligibility,description,last_date').eq('is_active',true).order('created_at',{ascending:false});if(error)throw error;jobsList=(data||[]).filter(j=>!j.last_date||j.last_date>=new Date().toISOString().slice(0,10));const cities=[...new Set(jobsList.map(j=>(j.city||j.location||'Other').trim()).filter(Boolean))].sort();$('citySelect').innerHTML='<option value="">Choose a city</option>'+cities.map(c=>'<option>'+esc(c)+'</option>').join('');$('jobsStatus').textContent=jobsList.length?'Select a city to see vacancies.':'There are no active vacancies right now.';}catch(e){$('jobsStatus').textContent='Vacancy portal setup pending. Please try again later.';}}$('citySelect').onchange=()=>{const city=$('citySelect').value,filtered=jobsList.filter(j=>(j.city||j.location||'Other').trim()===city);$('jobsStatus').textContent=city?filtered.length+' opening(s) in '+city+'.':'Select a city to see vacancies.';$('jobsGrid').innerHTML=filtered.map(j=>'<article class="job"><h2>'+esc(j.title)+'</h2><p class="meta">'+esc(j.department)+' · '+esc(j.location)+' · '+esc(j.employment_type)+'</p><p><b>Salary:</b> '+esc(j.salary||'As per skills')+'</p><p><b>Eligibility:</b> '+esc(j.eligibility)+'</p><p>'+esc(j.description)+'</p><p class="meta">Last date: '+esc(j.last_date||'Open until filled')+'</p><button type="button" data-apply="'+j.id+'">View & Apply</button></article>').join('');$('applyBox').hidden=true;};$('jobsGrid').onclick=e=>{const b=e.target.closest('[data-apply]');if(!b)return;const j=jobsList.find(x=>x.id===b.dataset.apply);if(!j)return;$('applyJob').value=j.id;$('selectedJobSummary').textContent=j.title+' · '+(j.city||j.location)+' · '+j.employment_type+' · Last date: '+(j.last_date||'Open until filled');$('applyBox').hidden=false;$('applyBox').scrollIntoView({behavior:'smooth'});};$('applyForm').onsubmit=async e=>{e.preventDefault();const p={job_id:$('applyJob').value,full_name:$('appName').value.trim(),email:$('appEmail').value.trim(),phone:$('appPhone').value.trim(),qualification:$('appQualification').value.trim(),resume_link:$('appResume').value.trim(),message:$('appMessage').value.trim()};$('applyStatus').textContent='Submitting…';const b=e.submitter;b.disabled=true;try{const {error}=await sb.from('job_applications').insert(p);if(error)throw error;$('applyStatus').textContent='Application submitted successfully.';$('applyForm').reset();}catch(x){$('applyStatus').textContent='Could not submit: '+x.message;}finally{b.disabled=false;}};load();</script></body></html>
